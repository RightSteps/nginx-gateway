server {
    listen 80;
    server_name rightday.arxio.in;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name rightday.arxio.in;

    ssl_certificate      /etc/letsencrypt/live/rightday.arxio.in/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/rightday.arxio.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2M;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rightday_upstream http://rightday-api:5000;

    location / {
        proxy_pass $rightday_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    access_log /var/log/nginx/rightday.access.log;
    error_log /var/log/nginx/rightday.error.log;
}
